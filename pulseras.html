<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulseras - Ana Store</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #fff8fc;
    color: #333;
    text-align: center;
}

header {
    background: linear-gradient(135deg, #ffd6e8, #fff0f7);
    padding: 25px 15px;
}

h1 {
    color: #c2185b;
    font-size: 30px;
}

.subtitulo {
    margin-top: 8px;
    color: #666;
}

.contenedor {
    padding: 25px 15px;
    max-width: 900px;
    margin: auto;
}

.productos {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.producto {
    background: white;
    border-radius: 15px;
    padding: 10px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.producto img {
    width: 100%;
    border-radius: 12px;
}

.boton {
    display: inline-block;
    margin-top: 25px;
    padding: 12px 22px;
    background: #c2185b;
    color: white;
    text-decoration: none;
    border-radius: 25px;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>✨ Pulseras ✨</h1>
    <p class="subtitulo">Conoce nuestros diseños</p>
</header>

<div class="contenedor">

    <div class="productos">

        <div class="producto">
            <img src="IMG-20260911-WA0319.jpg" alt="Pulsera">
        </div>

        <div class="producto">
            <img src="IMG-20260914-WA0014.jpg" alt="Pulsera">
        </div>

        <div class="producto">
            <img src="IMG-20260914-WA0029.jpg" alt="Pulsera">
        </div>

    </div>

    <a class="boton" href="index.html">← Volver al catálogo</a>

</div>

</body>
</html>
